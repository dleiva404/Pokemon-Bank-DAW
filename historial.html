<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historial</title>

    <!-- estilos del dashboard -->
    <link rel="stylesheet" href="css/dashboard.css" />

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />

    <!-- chart.js para el grafico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- jspdf para descargar historial -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
      body {
        background-image: none !important;
        background-color: #f4f4f4;
        font-family: Arial;
        margin: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-bottom: 20px;
      }

      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #ccc;
        text-align: center;
      }

      th {
        background: #2c3e50;
        color: white;
      }

      canvas {
        max-width: 400px;
        margin: auto;
        display: block;
      }
    </style>
  </head>

  <body>
    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark barra">
      <a class="navbar-brand" href="#">Pokémon Bank</a>
      <div class="ml-auto d-flex align-items-center">
        <span class="text-white mr-3" id="nombreNav">Ash Ketchum</span>
        <span class="text-white mr-3" id="cuentaNav">Cuenta: 0987654321</span>
        <a href="#" class="btn boton-login text-white" onclick="cerrarSesion()"
          >Cerrar Sesión</a
        >
      </div>
    </nav>

    <div class="contenedor-principal">
      <div class="container mt-4">
        <h2><center>Historial de Transacciones</center></h2>
        <h6><center>(Últimos 5 movimientos)</center></h6>

        <!-- tabla de movimientos -->
        <table id="tabla">
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Monto ($)</th>
          </tr>
        </table>

        <!-- boton para descargar historial en PDF -->
        <button
          onclick="descargarHistorialPDF()"
          class="btn btn-danger mt-2 mb-4"
        >
          <i class="fas fa-file-pdf mr-2"></i> Descargar Historial PDF
        </button>

        <h2>Gráfico de Movimientos</h2>
        <!-- grafico de pastel con chart.js -->
        <canvas id="grafico"></canvas>

        <br />
        <a href="dashboard.html">⬅ Volver</a>
      </div>
    </div>

    <script>
      // verificar sesion al inicio
      if (!localStorage.getItem("usuarioLogueado")) {
        window.location.href = "index.html";
      }

      let grafico;

      // lee datos del usuario activo desde localStorage
      function actualizarUI() {
        var claveUsuario = localStorage.getItem("usuarioActivo") || "usuario";
        var usuario = JSON.parse(localStorage.getItem(claveUsuario));
        var movimientos = usuario ? usuario.movimientos : [];

        // actualizar navbar con datos del usuario activo
        if (usuario) {
          document.getElementById("nombreNav").textContent = usuario.nombre;
          document.getElementById("cuentaNav").textContent =
            "Cuenta: " + usuario.cuenta;
        }

        // mostrar solo los ultimos 5 movimientos
        var ultimos = movimientos.slice(-5);
        actualizarTabla(ultimos);
        actualizarGrafica(movimientos);
      }

      // llena la tabla con los movimientos
      function actualizarTabla(movimientos) {
        var tabla = document.getElementById("tabla");
        tabla.innerHTML = `
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Monto ($)</th>
          </tr>
        `;

        if (movimientos.length === 0) {
          tabla.innerHTML += `
            <tr>
              <td colspan="3">No hay movimientos registrados</td>
            </tr>
          `;
          return;
        }

        movimientos.forEach(function (mov) {
          tabla.innerHTML += `
            <tr>
              <td>${mov.fecha}</td>
              <td>${mov.tipo}</td>
              <td>$${parseFloat(mov.monto).toFixed(2)}</td>
            </tr>
          `;
        });
      }

      // genera el grafico de pastel con chart.js
      function actualizarGrafica(movimientos) {
        var depositos = 0;
        var retiros = 0;
        var servicios = 0;

        // contar transacciones por tipo
        movimientos.forEach(function (m) {
          if (m.tipo === "Depósito") {
            depositos++;
          } else if (m.tipo === "Retiro") {
            retiros++;
          } else {
            servicios++;
          }
        });

        var ctx = document.getElementById("grafico").getContext("2d");

        if (grafico) {
          grafico.destroy();
        }

        grafico = new Chart(ctx, {
          type: "pie",
          data: {
            labels: ["Depósitos", "Retiros", "Servicios"],
            datasets: [
              {
                data: [depositos, retiros, servicios],
                backgroundColor: ["#28a745", "#cc0000", "#3085d6"],
              },
            ],
          },
          options: {
            plugins: {
              legend: { position: "bottom" },
            },
          },
        });
      }

      // descarga el historial completo en PDF
      function descargarHistorialPDF() {
        var claveUsuario = localStorage.getItem("usuarioActivo") || "usuario";
        var usuario = JSON.parse(localStorage.getItem(claveUsuario));
        var movimientos = usuario ? usuario.movimientos : [];

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // encabezado rojo
        doc.setFillColor(204, 0, 0);
        doc.rect(0, 0, 210, 30, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(20);
        doc.text("Pokémon Bank", 105, 15, { align: "center" });
        doc.setFontSize(12);
        doc.text("Historial de Transacciones", 105, 25, { align: "center" });

        // datos del usuario
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(12);
        doc.text("Titular: " + usuario.nombre, 20, 45);
        doc.text("Cuenta: " + usuario.cuenta, 20, 55);
        doc.text("Fecha de descarga: " + new Date().toLocaleString(), 20, 65);

        // linea separadora
        doc.setDrawColor(204, 0, 0);
        doc.line(20, 70, 190, 70);

        // encabezados de la tabla
        doc.setFillColor(44, 62, 80);
        doc.rect(20, 75, 170, 8, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(10);
        doc.text("Fecha", 25, 81);
        doc.text("Tipo", 85, 81);
        doc.text("Monto", 165, 81);

        // filas de movimientos
        doc.setTextColor(0, 0, 0);
        var y = 95;
        movimientos.forEach(function (mov, index) {
          // fondo alternado
          if (index % 2 === 0) {
            doc.setFillColor(245, 245, 245);
            doc.rect(20, y - 5, 170, 8, "F");
          }
          doc.setFontSize(9);
          doc.text(String(mov.fecha), 25, y);
          doc.text(String(mov.tipo), 85, y);
          doc.text("$" + parseFloat(mov.monto).toFixed(2), 165, y);
          y += 10;

          // nueva pagina si se llena
          if (y > 270) {
            doc.addPage();
            y = 20;
          }
        });

        // linea final y pie
        doc.setDrawColor(204, 0, 0);
        doc.line(20, y + 5, 190, y + 5);
        doc.setFontSize(10);
        doc.setTextColor(100, 100, 100);
        doc.text(
          "Pokémon Bank © 2026 - Todos los derechos reservados",
          105,
          y + 15,
          { align: "center" },
        );

        doc.save("historial-" + usuario.nombre + ".pdf");
      }

      // limpia la sesion y redirige al login
      function cerrarSesion() {
        localStorage.removeItem("usuarioLogueado");
        localStorage.removeItem("usuarioActivo");
        window.location.href = "index.html";
      }

      window.onload = actualizarUI;
    </script>

    <!-- footer -->
    <footer class="pie">
      <p>Pokemon Bank © 2026 - Todos los derechos reservados</p>
    </footer>
  </body>
</html>
